[project]
name = "google-ads-mcp"
version = "0.1.0"
description = "A comprehensive Google Ads MCP server with ~47 tools for full read/write access"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.26.0",
    "google-ads>=29.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
google-ads-mcp = "google_ads_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_ads_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
]
